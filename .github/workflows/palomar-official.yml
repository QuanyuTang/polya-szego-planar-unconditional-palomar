name: Official Palomar mechanical preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-palomar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: cipreflight1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"authorization_relationship":"I am a responsible author or maintainer","comparator_config_path":"comparator.json"}'
