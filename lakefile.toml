name = "RequestProject"
defaultTargets = ["AreaProof", "Challenge", "Solution", "SubmissionSolutionAudit"]
moreLeanArgs = ["-j1"]

[leanOptions]
Elab.async = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[require]]
name = "EllipticPdes"
git = "https://github.com/alejandro-soto-franco/EllipticPDE.git"
rev = "ec784093f30308ef770ff855ce624725adf6f870"
subDir = "lean"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

