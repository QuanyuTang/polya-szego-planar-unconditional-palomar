# Contained source package for the unchanged reviewed EllipticPDE closure.
# Origin and exact source hashes: ../../verification/elliptic-vendor.json
name = "EllipticPdes"
version = "0.1.0"
defaultTargets = ["EllipticPdes"]

# Preserve the upstream package elaboration and linter options.
[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

